name: Manual - transfer points

on:
  workflow_dispatch:
    inputs:
      from:
        description: 'Goal channel to take points from (e.g. batsy)'
        required: true
      to:
        description: 'Goal channel to give points to (e.g. brooke)'
        required: true
      amount:
        description: 'Points to move'
        required: true
      note:
        description: 'Optional note'
        required: false
      interaction_token:
        description: 'Internal: set by the /transfer Discord command webhook, leave blank for manual runs'
        required: false
      application_id:
        description: 'Internal: set by the /transfer Discord command webhook, leave blank for manual runs'
        required: false

permissions:
  contents: write

concurrency: gacha-health-weekly

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run transfer
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          CATEGORY_NAME: ${{ vars.CATEGORY_NAME }}
          RESULTS_CHANNEL_NAME: ${{ vars.RESULTS_CHANNEL_NAME }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          TRANSFER_FROM: ${{ inputs.from }}
          TRANSFER_TO: ${{ inputs.to }}
          TRANSFER_AMOUNT: ${{ inputs.amount }}
          TRANSFER_NOTE: ${{ inputs.note }}
          INTERACTION_TOKEN: ${{ inputs.interaction_token }}
          DISCORD_APPLICATION_ID: ${{ inputs.application_id }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Transfer points from ${{ inputs.from }} to ${{ inputs.to }} [skip ci]"
          git push
