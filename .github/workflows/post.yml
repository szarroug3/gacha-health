name: Manual - post weekly messages

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force reprint even for a channel that already has this week''s message'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency: gacha-health-weekly

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run post
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          CATEGORY_NAME: ${{ vars.CATEGORY_NAME }}
          RESULTS_CHANNEL_NAME: ${{ vars.RESULTS_CHANNEL_NAME }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          FORCE_REPRINT: ${{ inputs.force }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update goals tracker state [skip ci]"
          git push
