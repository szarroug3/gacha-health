name: Weekly goals job

on:
  schedule:
    # ~Sunday 12:00 AM Central. GitHub Actions cron is UTC-only, so this
    # drifts by an hour across the DST changeover twice a year - fine for a
    # casual weekly bot. Currently set for CDT (UTC-5); during CST
    # (Nov-Mar) it fires around 11:00 PM Saturday Central instead.
    # Off the top of the hour on purpose - GitHub Actions scheduled runs are
    # most likely to be delayed or dropped at :00, especially at the start
    # of an hour under high load.
    - cron: '3 5 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force reprint even for a channel that already has this week''s message'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency: gacha-health-weekly

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run run
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          CATEGORY_NAME: ${{ vars.CATEGORY_NAME }}
          RESULTS_CHANNEL_NAME: ${{ vars.RESULTS_CHANNEL_NAME }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          FORCE_REPRINT: ${{ inputs.force }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Update goals tracker state [skip ci]"
          git push
