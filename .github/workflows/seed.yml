name: Manual - adopt existing dated messages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency: gacha-health-weekly

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run seed
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          GUILD_ID: ${{ secrets.GUILD_ID }}
          CATEGORY_NAME: ${{ vars.CATEGORY_NAME }}
          RESULTS_CHANNEL_NAME: ${{ vars.RESULTS_CHANNEL_NAME }}
          TIMEZONE: ${{ vars.TIMEZONE }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "Seed tracked messages from existing posts [skip ci]"
          git push
